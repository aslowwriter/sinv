[package]
name         = "sinv"
version      = "0.1.0"
authors      = ["Sam Vente <savente93@proton.me>"]
edition      = "2024"
rust-version = "1.85"
description  = "A CLI toolkit for inspecting Sphinx object inventories"
readme       = "README.md"
license      = "MIT"


documentation = "https://docs.rs/sinv"
repository    = "https://github.com/aslowwriter/sinv"


[[bin]]
path = "src/main.rs"
name = "sinv"


[dependencies]
thiserror           = "2.0"
tracing             = { version = "0", features = ["attributes"] }
tracing-subscriber  = "0"
tracing-error       = "0"
clap                = { version = "4", features = ["derive", "unicode", "cargo"] }
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }

sphinx_inv = { version = "0.3.0", path = "../sphinx_inv" }
reqwest = { version = "0.13.4", features = ["blocking"] }
url = "2.5.8"
frizbee = "0.11.0"

[dev-dependencies]
pretty_assertions = "1.4.1"


[profile.release]
debug         = 0
lto           = "fat"
codegen-units = 1
strip         = "symbols"

[profile.dev]
debug = 0

[profile.bench]
inherits = "release"
debug    = 2         # necessary for many profilers
strip    = "none"    #only affects binary size, not runtime, but makes profiling easier

# please tell me what to do Clippy-senpai
[lints.clippy]
pedantic                   = { level = "warn", priority = -1 }
single_match               = "warn"
single_match_else          = "warn"
needless_match             = "warn"
needless_late_init         = "warn"
redundant_pattern_matching = "warn"
redundant_pattern          = "warn"
redundant_guards           = "warn"
collapsible_match          = "warn"
match_single_binding       = "warn"
match_same_arms            = "warn"
match_ref_pats             = "warn"
match_bool                 = "warn"
needless_bool              = "deny"
unwrap_used                = "warn"
expect_used                = "warn"
must_use_candidate         = "allow"
missing_errors_doc         = "allow"
missing_panics_doc         = "allow"

print_stdout = "warn"
dbg_macro = "warn"
